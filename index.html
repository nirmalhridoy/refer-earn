<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refer Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#9333ea);
min-height:100vh;
padding:20px;
color:#222;
}

.container{
max-width:800px;
margin:auto;
}

h1{
text-align:center;
color:white;
margin-bottom:20px;
font-size:32px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

h2{
margin-bottom:15px;
color:#4f46e5;
}

p{
margin:8px 0;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#4f46e5;
color:white;
cursor:pointer;
font-weight:bold;
margin-top:10px;
transition:0.3s;
}

button:hover{
background:#3730a3;
}

input, select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-top:10px;
outline:none;
}

input:focus, select:focus{
border-color:#4f46e5;
}

#userInfo{
text-align:center;
color:white;
margin-top:10px;
margin-bottom:10px;
}

#logoutBtn{
background:#dc2626;
}

#logoutBtn:hover{
background:#991b1b;
}

.listBox{
background:#f8fafc;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.requestCard{
border:1px solid #ddd;
padding:12px;
margin-top:10px;
border-radius:10px;
background:#fafafa;
}

.approveBtn{
background:#16a34a;
}

.approveBtn:hover{
background:#166534;
}
</style>
</head>
<body>

<div class="container">

<h1>Refer Earn</h1>

<div style="text-align:center;">
<button id="loginBtn">Login with Google</button>
<p id="userInfo"></p>
<button id="logoutBtn" style="display:none;">Logout</button>
</div>

<div class="box">
<h2>User Dashboard</h2>

<p><strong>Balance:</strong> <span id="balance">0</span>৳</p>

<p><strong>Total Referrals:</strong> <span id="refCount">0</span></p>

<p><strong>Referral Users:</strong></p>
<div id="refList" class="listBox"></div>

<p><strong>Your Referral Link:</strong></p>
<input id="refLink" readonly>
<button id="copyBtn">Copy Referral Link</button>

<select id="paymentMethod">
<option value="">Select Payment Method</option>
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
</select>

<input id="withdrawNumber" type="tel" placeholder="Enter bKash/Nagad number">
<input id="withdrawAmount" type="number" placeholder="Enter amount">

<button id="withdrawBtn">Withdraw</button>

<p><strong>My Withdraw History:</strong></p>
<div id="myWithdraws" class="listBox"></div>
</div>

<div class="box" id="adminPanel" style="display:none;">
<h2>Admin Panel</h2>

<p><strong>Pending Requests:</strong> <span id="pendingCount">0</span></p>
<p><strong>Total Users:</strong> <span id="userCount">0</span></p>

<div id="withdrawList"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
authDomain: "refer-earn-73e38.firebaseapp.com",
projectId: "refer-earn-73e38",
storageBucket: "refer-earn-73e38.firebasestorage.app",
messagingSenderId: "323369987305",
appId: "1:323369987305:web:7c8eead19bff6454f4d478",
measurementId: "G-Z0WLNVH8YZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("loginBtn").onclick = async ()=>{
const provider=new GoogleAuthProvider();
await signInWithPopup(auth,provider);
};

onAuthStateChanged(auth,async(user)=>{
if(!user)return;

document.getElementById("userInfo").innerText=
"Logged in: "+user.email;

document.getElementById("loginBtn").style.display="none";
document.getElementById("logoutBtn").style.display="inline-block";

if(user.email==="antorahmed0185@gmail.com"){
document.getElementById("adminPanel").style.display="block";
}

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

const params=new URLSearchParams(window.location.search);
const ref=params.get("ref");

if(!snap.exists()){
await setDoc(userRef,{
balance:0,
email:user.email,
referrals:0,
referredBy:ref||null
});

if(ref && ref!==user.uid){
const refRef=doc(db,"users",ref);
const refSnap=await getDoc(refRef);

if(refSnap.exists()){
const oldBalance=refSnap.data().balance||0;
const oldRefs=refSnap.data().referrals||0;

await updateDoc(refRef,{
balance:oldBalance+10,
referrals:oldRefs+1
});
}
}
}

loadUserData(user.uid);
loadReferralUsers(user.uid);
loadMyWithdraws(user.uid);
loadWithdrawRequests();
loadUserCount();
});

async function loadUserData(uid){
const snap=await getDoc(doc(db,"users",uid));
if(!snap.exists())return;

const data=snap.data();

document.getElementById("balance").innerText=data.balance||0;
document.getElementById("refCount").innerText=data.referrals||0;
document.getElementById("refLink").value=
"https://nirmalhridoy.github.io/refer-earn/?ref="+uid;
}

document.getElementById("withdrawBtn").onclick=async()=>{
const method=document.getElementById("paymentMethod").value;
const number=document.getElementById("withdrawNumber").value;
const amount=document.getElementById("withdrawAmount").value;

if(!method){
alert("Select payment method");
return;
}

if(!number || !amount){
alert("Fill all fields");
return;
}

if(number.length!==11){
alert("Enter valid 11-digit number");
return;
}

if(Number(amount)<100){
alert("Minimum withdraw is 100৳");
return;
}

const user=auth.currentUser;
if(!user){
alert("Login first");
return;
}

const userSnap=await getDoc(doc(db,"users",user.uid));
const currentBalance=userSnap.data().balance||0;

if(Number(amount)>currentBalance){
alert("Insufficient balance");
return;
}

await addDoc(collection(db,"withdrawRequests"),{
email:user.email,
uid:user.uid,
method:method,
number:number,
amount:amount,
status:"pending"
});

alert("Withdraw request submitted!");

document.getElementById("paymentMethod").value="";
document.getElementById("withdrawNumber").value="";
document.getElementById("withdrawAmount").value="";

loadMyWithdraws(user.uid);
loadWithdrawRequests();
};

async function loadMyWithdraws(uid){
const box=document.getElementById("myWithdraws");
box.innerHTML="";

const snapshot=await getDocs(collection(db,"withdrawRequests"));

snapshot.forEach((doc)=>{
const data=doc.data();

if(data.uid===uid){
box.innerHTML +=
"<p>"+data.method+" | "+data.amount+"৳ - "+data.status+"</p>";
}
});
}

async function loadReferralUsers(uid){
const list=document.getElementById("refList");
list.innerHTML="";

const snapshot=await getDocs(collection(db,"users"));

snapshot.forEach((doc)=>{
const data=doc.data();

if(data.referredBy===uid){
list.innerHTML +=
"<p>"+data.email+"</p>";
}
});
}

async function loadWithdrawRequests(){
const list=document.getElementById("withdrawList");
list.innerHTML="<h3>Withdraw Requests</h3>";

const snapshot=await getDocs(collection(db,"withdrawRequests"));

let pending=0;

snapshot.forEach((docSnap)=>{
const data=docSnap.data();

if(data.status==="pending"){
pending++;
}

list.innerHTML += `
<div class="requestCard">
<p><strong>Email:</strong> ${data.email}</p>
<p><strong>Method:</strong> ${data.method}</p>
<p><strong>Number:</strong> ${data.number}</p>
<p><strong>Amount:</strong> ${data.amount}৳</p>
<p><strong>Status:</strong> ${data.status}</p>

${data.status==="pending"
? `<button class="approveBtn" onclick="approveWithdraw('${docSnap.id}','${data.uid}',${data.amount})">Approve</button>`
: ""}
</div>
`;
});

document.getElementById("pendingCount").innerText=pending;
}

window.approveWithdraw=async(requestId,uid,amount)=>{
const userRef=doc(db,"users",uid);
const userSnap=await getDoc(userRef);

if(!userSnap.exists()) return;

const oldBalance=userSnap.data().balance||0;

await updateDoc(userRef,{
balance:oldBalance-amount
});

await updateDoc(doc(db,"withdrawRequests",requestId),{
status:"approved"
});

alert("Withdraw approved!");

loadUserData(uid);
loadMyWithdraws(uid);
loadWithdrawRequests();
};

async function loadUserCount(){
const snapshot=await getDocs(collection(db,"users"));
document.getElementById("userCount").innerText=snapshot.size;
}

document.getElementById("copyBtn").onclick=async()=>{
const link=document.getElementById("refLink").value;
await navigator.clipboard.writeText(link);
alert("Referral link copied!");
};

document.getElementById("logoutBtn").onclick=async()=>{
await signOut(auth);
location.reload();
};
</script>

</body>
</html>
