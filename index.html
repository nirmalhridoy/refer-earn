<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refer Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:linear-gradient(135deg,#4f46e5,#9333ea);min-height:100vh;padding:20px;color:#222;}
.container{max-width:800px;margin:auto;}
h1{text-align:center;color:white;margin-bottom:20px;font-size:32px;}
.box{background:white;padding:20px;border-radius:15px;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
h2{margin-bottom:15px;color:#4f46e5;}
p{margin:8px 0;}
button{padding:12px 18px;border:none;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;font-weight:bold;margin-top:10px;}
button:hover{background:#3730a3;}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:10px;}
#userInfo{text-align:center;color:white;margin:10px 0;}
#logoutBtn{background:#dc2626;}
#logoutBtn:hover{background:#991b1b;}
.listBox{background:#f8fafc;padding:10px;border-radius:10px;margin-top:10px;}
.smallBox{background:#fff7ed;padding:10px;border-radius:10px;margin-top:10px;border:1px solid #fdba74;}
</style>
</head>

<body>

<div class="container">

<h1>Refer Earn</h1>

<div style="text-align:center;">
<button id="loginBtn">Login with Google</button>
<p id="userInfo"></p>
<button id="logoutBtn" style="display:none;">Logout</button>
</div>

<!-- FACEBOOK -->
<div class="box">
<h2>Bonus Task</h2>

<button onclick="window.open('https://www.facebook.com/profile.php?id=61587170180010','_blank')">
Go to Facebook Profile
</button>

<p>Post share kore screenshot upload korle +5৳ bonus</p>

<input type="file" id="screenshot">

<button id="uploadShareBtn">Submit Screenshot</button>

<p style="color:red;margin-top:10px;">
⚠️ Screenshot submit na korle withdraw issue hole authority responsible na
</p>
</div>

<!-- DASHBOARD -->
<div class="box">
<h2>User Dashboard</h2>

<p><strong>Balance:</strong> <span id="balance">0</span>৳</p>
<p><strong>Total Referrals:</strong> <span id="refCount">0</span></p>

<p><strong>Your Referral Link:</strong></p>
<input id="refLink" readonly>
<button id="copyBtn">Copy Referral Link</button>

<p><strong>Referral Users:</strong></p>
<div id="refList" class="listBox"></div>

<div id="activationBox" class="box">
<h2>Activate Account</h2>

<input id="payNumber" placeholder="Payment Number">
<input id="trxId" placeholder="Transaction ID">

<button id="activateBtn">Submit Activation</button>
<p id="activeStatus"></p>
</div>

</div>

<!-- WITHDRAW -->
<div class="box">
<h2>Withdraw</h2>

<div class="smallBox" id="withdrawRules"></div>

<select id="paymentMethod">
<option value="">Select Method</option>
<option>bKash</option>
<option>Nagad</option>
</select>

<input id="withdrawNumber" placeholder="Number">
<input id="withdrawAmount" type="number" placeholder="Amount">

<button id="withdrawBtn">Withdraw</button>

<div id="myWithdraws" class="listBox"></div>
</div>

<!-- LEADERBOARD -->
<div class="box">
<h2>Leaderboard</h2>
<div id="leaderboard"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore, doc, getDoc, setDoc, updateDoc,
collection, addDoc, getDocs, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
getAuth, GoogleAuthProvider, signInWithPopup,
onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
authDomain:"refer-earn-73e38.firebaseapp.com",
projectId:"refer-earn-73e38"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

/* LOGIN */
document.getElementById("loginBtn").onclick=async()=>{
await signInWithPopup(auth,new GoogleAuthProvider());
};

/* USER */
onAuthStateChanged(auth,async(user)=>{
if(!user)return;

document.getElementById("userInfo").innerText="Logged in: "+user.email;

const ref=new URLSearchParams(location.search).get("ref");

const userRef=doc(db,"users",user.uid);
const snap=await getDoc(userRef);

if(!snap.exists()){
await setDoc(userRef,{
balance:0,email:user.email,referrals:0,referredBy:ref||null,active:false
});
}

load(user.uid);
});

/* LOAD */
function load(uid){

onSnapshot(doc(db,"users",uid),(snap)=>{
const d=snap.data();
document.getElementById("balance").innerText=d.balance||0;
document.getElementById("refCount").innerText=d.referrals||0;
document.getElementById("refLink").value="https://referearn.site.live/?ref="+uid;

ruleBox(d);
});
}

/* RULES */
function ruleBox(d){
let txt="";
if((d.balance||0)>=1000) txt="Need 12 referrals";
else if((d.balance||0)>=500) txt="Need 6 referrals";
else if((d.balance||0)>=250) txt="Need 3 referrals";
else txt="Withdraw available after threshold";

document.getElementById("withdrawRules").innerText=txt;
}

/* SHARE REQUEST */
document.getElementById("uploadShareBtn").onclick=async()=>{

const file=document.getElementById("screenshot").files[0];
const user=auth.currentUser;

if(!file)return alert("Upload screenshot first");

await addDoc(collection(db,"shareRequests"),{
uid:user.uid,
email:user.email,
status:"pending",
createdAt:Date.now()
});

alert("+5৳ request sent (admin approval needed)");
};

/* WITHDRAW */
document.getElementById("withdrawBtn").onclick=async()=>{

const user=auth.currentUser;
const snap=await getDoc(doc(db,"users",user.uid));

if(!snap.data().active)return alert("Activate first");

const amount=document.getElementById("withdrawAmount").value;

if(Number(amount)<100)return alert("Min 100৳");

if(Number(amount)>snap.data().balance)return alert("Not enough balance");

await addDoc(collection(db,"withdrawRequests"),{
uid:user.uid,
email:user.email,
amount,
status:"pending"
});

alert("Withdraw sent");
};

/* COPY */
document.getElementById("copyBtn").onclick=async()=>{
await navigator.clipboard.writeText(document.getElementById("refLink").value);
alert("Copied");
};

/* LOGOUT */
document.getElementById("logoutBtn").onclick=async()=>{
await signOut(auth);
location.reload();
};
</script>

</body>
</html>
