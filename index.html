<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Refer Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
    .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
    button { padding: 10px 16px; cursor: pointer; }
    input { padding: 8px; width: 100%; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Refer Earn</h1>
  <button id="loginBtn">Login with Google</button>
<p id="userInfo"></p>
  <div class="box">
    <h2>User Dashboard</h2>
    <p><strong>Balance:</strong> 0৳</p>
    <p><strong>Your Referral Link:</strong></p>
    <input value="https://your-site.vercel.app/?ref=YOUR_ID" readonly>
    <input id="withdrawNumber" placeholder="Enter bKash/Nagad number">
<input id="withdrawAmount" placeholder="Enter amount">
    <button id="withdrawBtn">Withdraw</button>
  </div>

  <hr>

  <div class="box">
    <h2>Admin Panel</h2>
    <p>Here you will manage users and withdraw requests.</p>
    <div id="withdrawList"></div>
  </div>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
  authDomain: "refer-earn-73e38.firebaseapp.com",
  projectId: "refer-earn-73e38",
  storageBucket: "refer-earn-73e38.firebasestorage.app",
  messagingSenderId: "323369987305",
  appId: "1:323369987305:web:7c8eead19bff6454f4d478",
  measurementId: "G-Z0WLNVH8YZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("loginBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  const result = await signInWithPopup(auth, provider);
  const user = result.user;

  document.getElementById("userInfo").innerText =
    "Logged in: " + user.email;

  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  let balance;

if (snap.exists()) {
  balance = snap.data().balance || 0;
} else {
  balance = 0;
  await setDoc(userRef, {
      balance: 0,
      email: user.email
    });

    // referral check
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");

    if (ref && ref !== user.uid) {
      const refRef = doc(db, "users", ref);
      const refSnap = await getDoc(refRef);

      if (refSnap.exists()) {
        const oldBalance = refSnap.data().balance || 0;
        await updateDoc(refRef, {
          balance: oldBalance + 10
        });
      }
    }
  }
document.querySelector("strong").parentNode.innerHTML =
  "<strong>Balance:</strong> " + balance + "৳";
  
  document.querySelector('input[readonly]').value =
  "https://nirmalhridoy.github.io/refer-earn/?ref=" + user.uid;};
    document.getElementById("withdrawBtn").onclick = async () => {
  const number = document.getElementById("withdrawNumber").value;
  const amount = document.getElementById("withdrawAmount").value;

  if (!number || !amount) {
    alert("Fill all fields");
    return;
  }

  const user = auth.currentUser;
  if (!user) {
    alert("Login first");
    return;
  }

  await addDoc(collection(db, "withdrawRequests"), {
    email: user.email,
    uid: user.uid,
    number: number,
    amount: amount,
    status: "pending"
  });

  alert("Withdraw request submitted!");
      document.getElementById("withdrawNumber").value = "";
document.getElementById("withdrawAmount").value = "";
};
    async function loadWithdrawRequests() {
  const list = document.getElementById("withdrawList");
  const snapshot = await getDocs(collection(db, "withdrawRequests"));

  list.innerHTML = "<h3>Withdraw Requests</h3>";

  snapshot.forEach((doc) => {
    const data = doc.data();

    list.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
        <p><strong>Email:</strong> ${data.email}</p>
        <p><strong>Number:</strong> ${data.number}</p>
        <p><strong>Amount:</strong> ${data.amount}৳</p>
        <p><strong>Status:</strong> ${data.status}</p>
      </div>
    `;
  });
}

loadWithdrawRequests();
    </script>
</body>
</html>
