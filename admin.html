/* =========================
   🚫 COOLDOWN SYSTEM STORAGE
========================= */

async function canEarn(email){

const ref = doc(db,"cooldowns",email);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
lastTime: 0
});
return true;
}

const data = snap.data();

const now = Date.now();

/* 30 sec cooldown */
if(now - data.lastTime < 30000){
return false;
}

await setDoc(ref,{
lastTime: now
});

return true;
}

/* =========================
   🧠 SAFE EARNING WRAPPER
========================= */

async function safeUpdateBalance(userRef, amount, email){

const allowed = await canEarn(email);

if(!allowed){
console.log("Cooldown active:", email);
return;
}

const snap = await getDoc(userRef);

if(!snap.exists()) return;

const data = snap.data();

let newBalance = (data.balance || 0) + amount;

await setDoc(userRef,{
...data,
balance:newBalance
});

}

/* =========================
   🔐 ADMIN SESSION SYSTEM
========================= */

const SESSION_KEY = "refer_earn_admin_session";

/* save session after login */
function setSession(){

localStorage.setItem(SESSION_KEY, JSON.stringify({
loggedIn: true,
time: Date.now()
}));

}

/* check session */
function checkSession(){

const session = JSON.parse(localStorage.getItem(SESSION_KEY));

if(!session || !session.loggedIn){
blockAccess();
return false;
}

/* session expire after 10 min */
const now = Date.now();

if(now - session.time > 10 * 60 * 1000){
localStorage.removeItem(SESSION_KEY);
alert("Session Expired!");
blockAccess();
return false;
}

/* refresh session time */
session.time = now;
localStorage.setItem(SESSION_KEY, JSON.stringify(session));

return true;

}

   🚫 BLOCK ACCESS FUNCTION
========================= */

function blockAccess(){

document.body.innerHTML = `
<h1 style="color:red;text-align:center;margin-top:50px;">

`;

}

/* =========================
   🔐 AUTO LOGIN CHECK
========================= */

throw new Error("No valid session");
}

========================= */

lastActivity = Date.now();
}

document.addEventListener("keydown",resetTimer);
document.addEventListener("click",resetTimer);

setInterval(()=>{

if(Date.now() - lastActivity > 5 * 60 * 1000){
localStorage.removeItem(SESSION_KEY);

blockAccess();
}

},10000);

window.addBalance = async function () {
const userId = document.getElementById("userIdInput").value;
const amount = Number(document.getElementById("amountInput").value);

if(!userId || !amount) return;

const ref = doc(db, "users", userId);
const snap = await getDoc(ref);

if(!snap.exists()){
document.getElementById("balanceMsg").innerText = "User not found!";
return;
}

const current = snap.data().balance || 0;

await updateDoc(ref, {
balance: current + amount
});

document.getElementById("balanceMsg").innerText = "Balance Added Successfully!";
};

/* =========================
   ➖ DEDUCT BALANCE
========================= */

window.deductBalance = async function () {
const userId = document.getElementById("userIdInput").value;
const amount = Number(document.getElementById("amountInput").value);

if(!userId || !amount) return;

const ref = doc(db, "users", userId);
const snap = await getDoc(ref);

if(!snap.exists()){
document.getElementById("balanceMsg").innerText = "User not found!";
return;
}

const current = snap.data().balance || 0;

await updateDoc(ref, {
balance: Math.max(0, current - amount)
});

document.getElementById("balanceMsg").innerText = "Balance Deducted Successfully!";
};
