<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refer Earn Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:linear-gradient(135deg,#1e3a8a,#7c3aed);
min-height:100vh;
padding:20px;
}
.container{
max-width:800px;
margin:auto;
}
h1{
text-align:center;
color:white;
margin-bottom:20px;
}
.box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
margin-bottom:20px;
}
button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
background:#2563eb;
color:white;
}
.approveBtn{
background:#16a34a;
}
.requestCard{
border:1px solid #ddd;
padding:12px;
margin-top:10px;
border-radius:10px;
background:#fafafa;
}
#adminPanel{
display:none;
}
#loginArea{
text-align:center;
}
#status{
color:white;
text-align:center;
margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>Refer Earn Admin Panel</h1>

<div id="loginArea">
<button id="adminLoginBtn">
Admin Login with Google
</button>
<p id="status"></p>
</div>

<div class="box" id="adminPanel">

<h2>Activation Requests</h2>
<div id="activationList"></div>

<hr style="margin:20px 0;">

<h2>Withdraw Requests</h2>
<div id="withdrawList"></div>

</div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
authDomain: "refer-earn-73e38.firebaseapp.com",
projectId: "refer-earn-73e38",
storageBucket: "refer-earn-73e38.firebasestorage.app",
messagingSenderId: "323369987305",
appId: "1:323369987305:web:7c8eead19bff6454f4d478"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "antorahmed0185@gmail.com";

document.getElementById("adminLoginBtn").onclick =
async ()=>{
const provider = new GoogleAuthProvider();
await signInWithPopup(auth, provider);
};

onAuthStateChanged(auth,(user)=>{

if(!user) return;

if(user.email!==ADMIN_EMAIL){
document.getElementById("status").innerText=
"Access denied";
return;
}

document.getElementById("loginArea").style.display=
"none";

document.getElementById("adminPanel").style.display=
"block";

loadActivationRequests();
loadWithdrawRequests();

});

/* ACTIVATION REQUESTS */
function loadActivationRequests(){

onSnapshot(
collection(db,"activationRequests"),
(snapshot)=>{

const box=
document.getElementById("activationList");

box.innerHTML="";

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

box.innerHTML += `
<div class="requestCard">
<p><b>${data.email}</b></p>
<p>Number: ${data.number}</p>
<p>TrxID: ${data.trxId}</p>
<p>Status: ${data.status}</p>

${data.status==="pending"
? `
<button class="approveBtn"
onclick="approveActivation(
'${docSnap.id}',
'${data.uid}'
)">
Approve
</button>
`
:""}
</div>
`;

});

});
}

/* APPROVE ACTIVATION */
window.approveActivation =
async(requestId,uid)=>{

const userRef=doc(db,"users",uid);

const userSnap=
await getDoc(userRef);

if(!userSnap.exists()) return;

const userData=userSnap.data();

await updateDoc(userRef,{
active:true,
balance:(userData.balance||0)+50
});

/* 5 LEVEL COMMISSION */
const levels=[50,10,5,2.5,1];

let currentRef=userData.referredBy;

for(let i=0;i<5;i++){

if(!currentRef) break;

const refRef=
doc(db,"users",currentRef);

const refSnap=
await getDoc(refRef);

if(!refSnap.exists()) break;

const refData=
refSnap.data();

await updateDoc(refRef,{
balance:
(refData.balance||0)+levels[i]
});

currentRef=
refData.referredBy;
}

await updateDoc(
doc(db,"activationRequests",requestId),
{
status:"approved"
}
);

alert("Activation approved!");

};

/* WITHDRAW REQUESTS */
function loadWithdrawRequests(){

onSnapshot(
collection(db,"withdrawRequests"),
(snapshot)=>{

const box=
document.getElementById("withdrawList");

box.innerHTML="";

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

box.innerHTML += `
<div class="requestCard">
<p><b>${data.email}</b></p>
<p>${data.method}</p>
<p>${data.number}</p>
<p>${data.amount}৳</p>
<p>${data.status}</p>

${data.status==="pending"
? `
<button class="approveBtn"
onclick="approveWithdraw(
'${docSnap.id}',
'${data.uid}',
${data.amount}
)">
Approve
</button>
`
:""}
</div>
`;

});

});
}

/* APPROVE WITHDRAW */
window.approveWithdraw =
async(requestId,uid,amount)=>{

const userRef=
doc(db,"users",uid);

const snap=
await getDoc(userRef);

const oldBalance=
snap.data().balance||0;

await updateDoc(userRef,{
balance:oldBalance-amount
});

await updateDoc(
doc(db,"withdrawRequests",requestId),
{
status:"approved"
}
);

alert("Withdraw approved!");

};

</script>
</body>
</html>
