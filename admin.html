<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#0f172a;padding:20px;color:white;}
h1{text-align:center;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0;}
.card{background:#1e293b;padding:15px;border-radius:10px;text-align:center;}
.box{background:white;color:black;padding:15px;border-radius:10px;margin-top:20px;}
button{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;margin-top:5px;}
.approve{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>

<body>

<h1>Admin Dashboard Pro</h1>

<div class="grid">
<div class="card"><h3 id="totalUsers">0</h3><p>Total Users</p></div>
<div class="card"><h3 id="activeUsers">0</h3><p>Active Users</p></div>
<div class="card"><h3 id="pendingW">0</h3><p>Pending Withdraw</p></div>
<div class="card"><h3 id="pendingA">0</h3><p>Pending Activation</p></div>
</div>

<div class="box">
<h2>Share Requests</h2>
<div id="shareList"></div>
</div>

<div class="box">
<h2>Activation Requests</h2>
<div id="actList"></div>
</div>

<div class="box">
<h2>Withdraw Requests</h2>
<div id="withdrawList"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,collection,doc,getDoc,updateDoc,onSnapshot,getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp({
apiKey:"AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
authDomain:"refer-earn-73e38.firebaseapp.com",
projectId:"refer-earn-73e38"
});

const db=getFirestore(app);
const auth=getAuth(app);

const ADMIN="antorahmed0185@gmail.com";

/* LOGIN */
document.body.onload=async()=>{
onAuthStateChanged(auth,async(user)=>{
if(!user||user.email!==ADMIN)return;

loadStats();
loadAll();
});
};

/* STATS */
async function loadStats(){

const users=await getDocs(collection(db,"users"));
document.getElementById("totalUsers").innerText=users.size;

let active=0;
users.forEach(u=>{
if(u.data().active)active++;
});
document.getElementById("activeUsers").innerText=active;

/* pending activation */
onSnapshot(collection(db,"activationRequests"),snap=>{
let p=0;
snap.forEach(d=>{
if(d.data().status==="pending")p++;
});
document.getElementById("pendingA").innerText=p;
});

/* pending withdraw */
onSnapshot(collection(db,"withdrawRequests"),snap=>{
let p=0;
snap.forEach(d=>{
if(d.data().status==="pending")p++;
});
document.getElementById("pendingW").innerText=p;
});
}

/* LOAD ALL */
function loadAll(){

/* SHARE */
onSnapshot(collection(db,"shareRequests"),snap=>{
let box=document.getElementById("shareList");
box.innerHTML="";
snap.forEach(d=>{
let data=d.data();

box.innerHTML+=`
<p>${data.email} - ${data.status}
<button class="approve" onclick="approveShare('${d.id}','${data.uid}')">Approve</button>
<button class="reject" onclick="rejectShare('${d.id}')">Reject</button>
</p>`;
});
});

/* ACTIVATION */
onSnapshot(collection(db,"activationRequests"),snap=>{
let box=document.getElementById("actList");
box.innerHTML="";
snap.forEach(d=>{
let data=d.data();

box.innerHTML+=`
<p>${data.email} - ${data.status}
<button class="approve" onclick="approveAct('${d.id}','${data.uid}')">Approve</button>
<button class="reject" onclick="rejectAct('${d.id}')">Reject</button>
</p>`;
});
});

/* WITHDRAW */
onSnapshot(collection(db,"withdrawRequests"),snap=>{
let box=document.getElementById("withdrawList");
box.innerHTML="";
snap.forEach(d=>{
let data=d.data();

box.innerHTML+=`
<p>${data.email} - ${data.amount}
<button class="approve" onclick="approveWithdraw('${d.id}','${data.uid}',${data.amount})">Approve</button>
<button class="reject" onclick="rejectWithdraw('${d.id}')">Reject</button>
</p>`;
});
});
}

/* SHARE APPROVE */
window.approveShare=async(id,uid)=>{
const ref=doc(db,"users",uid);
const s=await getDoc(ref);
await updateDoc(ref,{balance:(s.data().balance||0)+5});
await updateDoc(doc(db,"shareRequests",id),{status:"approved"});
};

/* SHARE REJECT */
window.rejectShare=async(id)=>{
await updateDoc(doc(db,"shareRequests",id),{status:"rejected"});
};

/* ACTIVATION */
window.approveAct=async(id,uid)=>{
const ref=doc(db,"users",uid);
const s=await getDoc(ref);
await updateDoc(ref,{active:true,balance:(s.data().balance||0)+50});
await updateDoc(doc(db,"activationRequests",id),{status:"approved"});
};

window.rejectAct=async(id)=>{
await updateDoc(doc(db,"activationRequests",id),{status:"rejected"});
};

/* WITHDRAW */
window.approveWithdraw=async(id,uid,amount)=>{
const ref=doc(db,"users",uid);
const s=await getDoc(ref);

let bal=s.data().balance||0;
if(bal<amount)return alert("Not enough balance");

await updateDoc(ref,{balance:bal-amount});
await updateDoc(doc(db,"withdrawRequests",id),{status:"approved"});
};

window.rejectWithdraw=async(id)=>{
await updateDoc(doc(db,"withdrawRequests",id),{status:"rejected"});
};

</script>

</body>
</html>
