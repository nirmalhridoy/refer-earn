<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refer Earn Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#1e3a8a,#7c3aed);
min-height:100vh;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

h1{
text-align:center;
color:white;
margin-bottom:20px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
background:#2563eb;
color:white;
}

button:hover{
background:#1d4ed8;
}

.approveBtn{
background:#16a34a;
}

.approveBtn:hover{
background:#166534;
}

.requestCard{
border:1px solid #ddd;
padding:12px;
margin-top:10px;
border-radius:10px;
background:#fafafa;
}

#adminPanel{
display:none;
}

#loginArea{
text-align:center;
}

#status{
color:white;
text-align:center;
margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>Refer Earn Admin Panel</h1>

<div id="loginArea">
<button id="adminLoginBtn">Admin Login with Google</button>
<p id="status"></p>
</div>

<div class="box" id="adminPanel">
<h2>Dashboard</h2>

<p><strong>Pending Requests:</strong>
<span id="pendingCount">0</span></p>

<p><strong>Total Users:</strong>
<span id="userCount">0</span></p>

<div id="withdrawList"></div>
</div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
authDomain: "refer-earn-73e38.firebaseapp.com",
projectId: "refer-earn-73e38",
storageBucket: "refer-earn-73e38.firebasestorage.app",
messagingSenderId: "323369987305",
appId: "1:323369987305:web:7c8eead19bff6454f4d478",
measurementId: "G-Z0WLNVH8YZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "antorahmed0185@gmail.com";

document.getElementById("adminLoginBtn").onclick =
async ()=>{
const provider = new GoogleAuthProvider();
await signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, async(user)=>{
if(!user) return;

if(user.email !== ADMIN_EMAIL){
document.getElementById("status").innerText =
"Access denied. Not admin.";
return;
}

document.getElementById("status").innerText =
"Logged in: " + user.email;

document.getElementById("loginArea").style.display =
"none";

document.getElementById("adminPanel").style.display =
"block";

loadWithdrawRequests();
loadUserCount();
});

async function loadWithdrawRequests(){
const list =
document.getElementById("withdrawList");

list.innerHTML =
"<h3>Withdraw Requests</h3>";

const snapshot =
await getDocs(collection(db,"withdrawRequests"));

let pending = 0;

snapshot.forEach((docSnap)=>{
const data = docSnap.data();

if(data.status === "pending"){
pending++;
}

list.innerHTML += `
<div class="requestCard">
<p><strong>Email:</strong> ${data.email}</p>
<p><strong>Method:</strong> ${data.method}</p>
<p><strong>Number:</strong> ${data.number}</p>
<p><strong>Amount:</strong> ${data.amount}৳</p>
<p><strong>Status:</strong> ${data.status}</p>

${data.status==="pending"
? `<button class="approveBtn"
onclick="approveWithdraw('${docSnap.id}',
'${data.uid}',
${data.amount})">
Approve
</button>`
: ""}
</div>
`;
});

document.getElementById("pendingCount").innerText =
pending;
}

window.approveWithdraw =
async(requestId, uid, amount)=>{

const userRef =
doc(db,"users",uid);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()) return;

const oldBalance =
userSnap.data().balance || 0;

await updateDoc(userRef,{
balance: oldBalance - amount
});

await updateDoc(
doc(db,"withdrawRequests",requestId),
{
status:"approved"
}
);

alert("Withdraw approved!");

loadWithdrawRequests();
};

async function loadUserCount(){
const snapshot =
await getDocs(collection(db,"users"));

document.getElementById("userCount").innerText =
snapshot.size;
}
</script>

</body>
  </html>
