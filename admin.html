<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refer Earn Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
min-height:100vh;
padding:16px;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
color:white;
}
.container{
max-width:1000px;
margin:auto;
}
.hero{
padding:24px;
border-radius:24px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
margin-bottom:20px;
}
.hero h1{
font-size:30px;
margin-bottom:10px;
}
.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-top:16px;
}
.stat{
background:rgba(255,255,255,.15);
padding:16px;
border-radius:16px;
text-align:center;
}
.stat b{
display:block;
font-size:24px;
margin-top:5px;
}
.card{
background:white;
color:#111827;
padding:18px;
border-radius:18px;
margin-bottom:18px;
}
.card h2{
color:#4338ca;
margin-bottom:10px;
}
.request{
border:1px solid #ddd;
padding:12px;
border-radius:12px;
margin-top:10px;
background:#f8fafc;
}
button{
border:none;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:8px;
margin-right:6px;
}
.approve{
background:#16a34a;
color:white;
}
.reject{
background:#dc2626;
color:white;
}
#loginBtn{
background:#4f46e5;
color:white;
}
#adminPanel{
display:none;
}
</style>
</head>
<body>

<div class="container">

<div class="hero">
<h1>Refer Earn Admin Panel</h1>

<button id="loginBtn">
Admin Login
</button>

<p id="status"></p>

<div class="stats">
<div class="stat">
Total Users
<b id="totalUsers">0</b>
</div>

<div class="stat">
Active Users
<b id="activeUsers">0</b>
</div>

<div class="stat">
Pending Activation
<b id="pendingA">0</b>
</div>

<div class="stat">
Pending Withdraw
<b id="pendingW">0</b>
</div>
</div>
</div>

<div id="adminPanel">

<div class="card">
<h2>Share Requests</h2>
<div id="shareList"></div>
</div>

<div class="card">
<h2>Activation Requests</h2>
<div id="actList"></div>
</div>

<div class="card">
<h2>Withdraw Requests</h2>
<div id="withdrawList"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
updateDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyBnP9QJgg6d874QB-a4meFbprLMEufRzuY",
authDomain:"refer-earn-73e38.firebaseapp.com",
projectId:"refer-earn-73e38",
storageBucket:"refer-earn-73e38.firebasestorage.app",
messagingSenderId:"323369987305",
appId:"1:323369987305:web:7c8eead19bff6454f4d478"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const ADMIN_EMAIL=
"antorahmed0185@gmail.com";

const TELEGRAM_BOT_TOKEN=
"8876000207:AAEvPrrD9zsoSO8DgMbnnPzwdTw7Iowlmf4";

const TELEGRAM_CHAT_ID=
"-5240659078";

async function sendTelegram(text){
await fetch(
`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:TELEGRAM_CHAT_ID,
text:text
})
}
);
}

document.getElementById("loginBtn").onclick=
async()=>{
await signInWithPopup(
auth,
new GoogleAuthProvider()
);
};

onAuthStateChanged(auth,async(user)=>{

if(!user)return;

if(user.email!==ADMIN_EMAIL){
document.getElementById("status").innerText=
"Access denied";
return;
}

document.getElementById("status").innerText=
"Logged in: "+user.email;

document.getElementById("adminPanel").style.display=
"block";

loadStats();
loadShare();
loadActivation();
loadWithdraw();
});

async function loadStats(){

const users=
await getDocs(collection(db,"users"));

let active=0;

users.forEach(d=>{
if(d.data().active)active++;
});

document.getElementById("totalUsers").innerText=
users.size;

document.getElementById("activeUsers").innerText=
active;
  onSnapshot(
collection(db,"activationRequests"),
(snap)=>{
let p=0;
snap.forEach(d=>{
if(d.data().status==="pending") p++;
});
document.getElementById("pendingA").innerText=p;
});

onSnapshot(
collection(db,"withdrawRequests"),
(snap)=>{
let p=0;
snap.forEach(d=>{
if(d.data().status==="pending") p++;
});
document.getElementById("pendingW").innerText=p;
});
}

/* SHARE REQUESTS */
function loadShare(){

onSnapshot(
collection(db,"shareRequests"),
(snap)=>{

let box=
document.getElementById("shareList");

box.innerHTML="";

snap.forEach(d=>{

let data=d.data();

box.innerHTML+=`
<div class="request">
<p><b>${data.email}</b></p>
<p>Status: ${data.status}</p>

<button class="approve"
onclick="approveShare('${d.id}','${data.uid}')">
Approve +5৳
</button>

<button class="reject"
onclick="rejectShare('${d.id}')">
Reject
</button>
</div>
`;
});
});
}

window.approveShare=
async(id,uid)=>{

const ref=
doc(db,"users",uid);

const snap=
await getDoc(ref);

await updateDoc(ref,{
balance:
(snap.data().balance||0)+5
});

await updateDoc(
doc(db,"shareRequests",id),
{
status:"approved"
}
);

alert("Share approved");
};

window.rejectShare=
async(id)=>{

await updateDoc(
doc(db,"shareRequests",id),
{
status:"rejected"
}
);

alert("Share rejected");
};

/* ACTIVATION REQUESTS */
function loadActivation(){

onSnapshot(
collection(db,"activationRequests"),
(snap)=>{

let box=
document.getElementById("actList");

box.innerHTML="";

snap.forEach(d=>{

let data=d.data();

box.innerHTML+=`
<div class="request">
<p><b>${data.email}</b></p>
<p>Number: ${data.number}</p>
<p>TRX ID: ${data.trxId}</p>
<p>Status: ${data.status}</p>

<button class="approve"
onclick="approveAct('${d.id}','${data.uid}')">
Approve
</button>

<button class="reject"
onclick="rejectAct('${d.id}')">
Reject
</button>
</div>
`;
});
});
}

window.approveAct=
async(id,uid)=>{

const ref=
doc(db,"users",uid);

const snap=
await getDoc(ref);

await updateDoc(ref,{
active:true,
balance:
(snap.data().balance||0)+50
});

await updateDoc(
doc(db,"activationRequests",id),
{
status:"approved"
}
);

alert("Account activated");
};

window.rejectAct=
async(id)=>{

await updateDoc(
doc(db,"activationRequests",id),
{
status:"rejected"
}
);

alert("Activation rejected");
};

/* WITHDRAW REQUESTS */
function loadWithdraw(){

onSnapshot(
collection(db,"withdrawRequests"),
(snap)=>{

let box=
document.getElementById("withdrawList");

box.innerHTML="";

snap.forEach(d=>{

let data=d.data();

box.innerHTML+=`
<div class="request">
<p><b>${data.email}</b></p>
<p>${data.method}</p>
<p>${data.number}</p>
<p>${data.amount}৳</p>
<p>Status: ${data.status}</p>

<button class="approve"
onclick="approveWithdraw(
'${d.id}',
'${data.uid}',
${data.amount}
)">
Approve
</button>

<button class="reject"
onclick="rejectWithdraw('${d.id}')">
Reject
</button>
</div>
`;
});
});
}

window.approveWithdraw=
async(id,uid,amount)=>{

const ref=
doc(db,"users",uid);

const snap=
await getDoc(ref);

let bal=
snap.data().balance||0;

if(bal<amount){
alert("Insufficient balance");
return;
}

await updateDoc(ref,{
balance:bal-amount
});

await updateDoc(
doc(db,"withdrawRequests",id),
{
status:"approved"
}
);

const req=
await getDoc(
doc(db,"withdrawRequests",id)
);

const data=req.data();

await sendTelegram(
"✅ Withdraw Approved\n\n"+
"Email: "+data.email+"\n"+
"Method: "+data.method+"\n"+
"Number: "+data.number+"\n"+
"Amount: "+data.amount+"৳"
);

alert("Withdraw approved + Telegram sent");
};

window.rejectWithdraw=
async(id)=>{

await updateDoc(
doc(db,"withdrawRequests",id),
{
status:"rejected"
}
);

alert("Withdraw rejected");
};

</script>

</body>
</html>
